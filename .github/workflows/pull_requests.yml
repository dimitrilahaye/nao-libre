name: Pull Requests

on:
  pull_request:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.23.5'

    - name: Install dependencies
      run: npm ci

    - name: Run build
      run: npm run build
